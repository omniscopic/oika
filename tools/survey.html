r(--link-hover); }\n@keyframes fs-breathe { 0%,100%{opacity:.35} 50%{opacity:1} }\ninput::placeholder, textarea::placeholder { color:#55555d; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#000;font-family:var(--font-text);color:var(--text-body);display:flex;justify-content:center\">\n  <div style=\"width:100%;max-width:440px;min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;background:#000;border-left:1px solid rgba(255,255,255,.06);border-right:1px solid rgba(255,255,255,.06)\">\n\n    <div style=\"position:sticky;top:0;z-index:900;padding:16px 18px 12px;background:rgba(6,6,8,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:space-between;gap:12px\">\n      <div style=\"display:flex;flex-direction:column;gap:3px\">\n        <div style=\"font:600 9px/1 var(--font-text);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-faint)\">Cobblestone Stories<\u002Fdiv>\n        <div style=\"font:700 17px/1.1 var(--font-display);letter-spacing:-0.02em;background-image:var(--gradient-silver);-webkit-background-clip:text;background-clip:text;color:transparent\">Field Survey<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:var(--radius-full);border:1px solid var(--hairline);background:var(--surface-card)\">\n        <div style=\"width:6px;height:6px;border-radius:50%;background:{{ gpsDot }};animation:fs-breathe 1.8s ease-in-out infinite\"><\u002Fdiv>\n        <span style=\"font:500 10.5px/1 var(--font-mono);letter-spacing:.04em;color:var(--text-body)\">{{ gpsLabel }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ prompting }}\" hint-placeholder-val=\"{{ false }}\">\n      <button sc-camel-on-click=\"{{ openPrompted }}\" style=\"all:unset;cursor:pointer;display:block;margin:12px 14px 0;padding:14px 15px;border-radius:var(--radius-lg);background-image:var(--gradient-spectrum);box-shadow:var(--glow-spectrum)\">\n        <div style=\"display:flex;align-items:center;gap:12px\">\n          <div style=\"font:700 15px/1 var(--font-mono);color:#fff\">{{ promptNum }}<\u002Fdiv>\n          <div style=\"flex:1;text-align:left;display:flex;flex-direction:column;gap:2px\">\n            <div style=\"font:600 14px/1.2 var(--font-text);color:#fff\">You're {{ promptDist }} from this station<\u002Fdiv>\n            <div style=\"font:400 11.5px/1.3 var(--font-text);color:rgba(255,255,255,.82)\">{{ promptWhere }} — tap to record it<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:400 18px/1 var(--font-text);color:#fff\">›<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fbutton>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isList }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"padding:16px 14px 30px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"padding:15px 16px;border-radius:var(--radius-lg);background:var(--surface-card);border:1px solid var(--hairline);display:flex;flex-direction:column;gap:7px\">\n          <div style=\"font:600 10px/1 var(--font-text);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)\">How to work a station<\u002Fdiv>\n          <div style=\"font:400 13px/1.5 var(--font-text);color:var(--text-body);text-wrap:pretty\">Stand exactly where a visitor should stand. Hold still and record the position — the app averages readings for twelve seconds. Then shoot with your Camera app and attach one frame here as the reference; the full-quality originals stay in your camera roll.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n          <div style=\"font:600 10px/1 var(--font-text);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-faint)\">Stations<\u002Fdiv>\n          <div style=\"font:500 11px/1 var(--font-mono);color:var(--text-muted)\">{{ doneCount }} / 7 recorded<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"7\">\n            <button sc-camel-on-click=\"{{ r.onClick }}\" style=\"all:unset;cursor:pointer;display:flex;align-items:center;gap:13px;padding:14px 15px;border-radius:var(--radius-lg);background:var(--surface-card);border:1px solid {{ r.border }}\" style-hover=\"background:var(--surface-raised)\">\n              <div style=\"width:40px;height:40px;flex:none;border-radius:var(--radius-md);background:{{ r.chipBg }};background-image:{{ r.chipImg }};position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font:700 13px/1 var(--font-mono);color:{{ r.chipColor }}\">\n                <sc-if value=\"{{ r.hasThumb }}\" hint-placeholder-val=\"{{ false }}\">\n                  <img alt=\"\" ref=\"{{ r.imgRef }}\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover\">\n                <\u002Fsc-if>\n                <span style=\"position:relative\">{{ r.chipText }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"flex:1;display:flex;flex-direction:column;gap:3px;text-align:left\">\n                <div style=\"font:600 15px/1.2 var(--font-text);color:#fff\">{{ r.rock }}<\u002Fdiv>\n                <div style=\"font:400 11.5px/1.35 var(--font-text);color:var(--text-muted)\">{{ r.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font:500 10px/1 var(--font-mono);letter-spacing:.06em;color:{{ r.stateColor }}\">{{ r.state }}<\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px\">\n          <button sc-camel-on-click=\"{{ toMap }}\" style=\"all:unset;cursor:pointer;flex:1;text-align:center;padding:15px;border-radius:var(--radius-full);border:1px solid var(--hairline-strong);font:600 14px/1 var(--font-text);color:#fff\" style-hover=\"background:rgba(255,255,255,.06)\">Map<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ toExport }}\" style=\"all:unset;cursor:pointer;flex:1;text-align:center;padding:15px;border-radius:var(--radius-full);background-image:var(--gradient-spectrum);box-shadow:var(--glow-spectrum);font:600 14px/1 var(--font-text);color:#fff\" style-hover=\"filter:brightness(1.12)\">Export survey<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isStation }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:14px 14px 34px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between\">\n          <button sc-camel-on-click=\"{{ toList }}\" style=\"all:unset;cursor:pointer;font:400 13px/1 var(--font-text);color:var(--text-muted)\" style-hover=\"color:#fff\">‹ Stations<\u002Fbutton>\n          <span style=\"font:600 10px/1 var(--font-text);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-faint)\">Station {{ st.num }} of 07<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <div style=\"font:600 10px/1 var(--font-text);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--spectrum-cyan)\">{{ st.era }}<\u002Fdiv>\n          <h2 style=\"margin:0;font:700 26px/1.08 var(--font-display);letter-spacing:-0.025em;background-image:var(--gradient-silver);-webkit-background-clip:text;background-clip:text;color:transparent\">{{ stRock }}<\u002Fh2>\n          <div style=\"font:400 13px/1.45 var(--font-text);color:var(--text-muted)\">Planned corner: {{ st.where }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:16px;border-radius:var(--radius-lg);background:var(--surface-card);border:1px solid var(--hairline);display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n            <div style=\"font:600 10px/1 var(--font-text);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)\">Live position<\u002Fdiv>\n            <div style=\"font:500 10.5px/1 var(--font-mono);color:{{ accColor }}\">{{ accLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:18px\">\n            <div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font:600 17px/1 var(--font-mono);color:#fff\">{{ liveLat }}<\u002Fspan><span style=\"font:500 9px/1 var(--font-text);letter-spacing:var(--tracking-caps);color:var(--text-faint)\">LATITUDE<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font:600 17px/1 var(--font-mono);color:#fff\">{{ liveLng }}<\u002Fspan><span style=\"font:500 9px/1 var(--font-text);letter-spacing:var(--tracking-caps);color:var(--text-faint)\">LONGITUDE<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:400 12px/1.45 var(--font-text);color:var(--text-muted)\">{{ plannedDist }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ sample }}\" style=\"all:unset;cursor:pointer;text-align:center;padding:16px;border-radius:var(--radius-full);background-image:{{ sampleBg }};background-color:{{ sampleBgColor }};border:1px solid {{ sampleBorder }};box-shadow:{{ sampleGlow }};font:600 15px/1 var(--font-text);color:#fff\" style-hover=\"filter:brightness(1.12)\">{{ sampleLabel }}<\u002Fbutton>\n          <sc-if value=\"{{ hasFix }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:13px;border-radius:var(--radius-md);background:#000;border:1px solid rgba(155,85,242,.5);display:flex;flex-direction:column;gap:5px\">\n              <div style=\"font:600 10px/1 var(--font-text);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--spectrum-violet)\">Recorded<\u002Fdiv>\n              <div style=\"font:600 13px/1.5 var(--font-mono);color:#fff\">{{ fixText }}<\u002Fdiv>\n              <div style=\"font:400 11px/1.4 var(--font-text);color:var(--text-muted)\">{{ fixMeta }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"padding:16px;border-radius:var(--radius-lg);background:var(--surface-card);border:1px solid var(--hairline);display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font:600 10px/1 var(--font-text);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)\">Shot list<\u002Fdiv>\n            <div style=\"font:400 11.5px/1.45 var(--font-text);color:var(--text-faint)\">The medium shot doubles as the annotated reference frame shown in the app.<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ shots }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;flex-direction:column;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)\">\n              <div style=\"display:flex;gap:12px;align-items:flex-start\">\n                <div style=\"width:22px;height:22px;flex:none;border-radius:5px;border:1px solid {{ s.dot }};background:{{ s.fill }};display:flex;align-items:center;justify-content:center;font:700 12px/1 var(--font-text);color:#fff\">{{ s.check }}<\u002Fdiv>\n                <div style=\"flex:1;display:flex;flex-direction:column;gap:2px\">\n                  <div style=\"font:600 14px/1.2 var(--font-text);color:#fff\">{{ s.title }}<\u002Fdiv>\n                  <div style=\"font:400 11.5px/1.4 var(--font-text);color:var(--text-muted)\">{{ s.body }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ s.hasThumb }}\" hint-placeholder-val=\"{{ false }}\">\n                <img alt=\"\" ref=\"{{ s.imgRef }}\" style=\"display:block;width:100%;height:{{ s.thumbH }};object-fit:cover;border-radius:var(--radius-md);border:{{ s.thumbBorder }};box-shadow:var(--shadow-image)\">\n              <\u002Fsc-if>\n              <div style=\"display:flex;gap:8px\">\n                <label style=\"cursor:pointer;flex:1;text-align:center;padding:13px;border-radius:var(--radius-full);background-image:var(--gradient-spectrum);font:600 13px/1 var(--font-text);color:#fff\">\n                  {{ s.camLabel }}\n                  <input type=\"file\" accept=\"image/*\" capture=\"environment\" sc-camel-on-change=\"{{ s.onFile }}\" style=\"display:none\">\n                <\u002Flabel>\n                <label style=\"cursor:pointer;flex:none;text-align:center;padding:13px 16px;border-radius:var(--radius-full);border:1px solid var(--hairline-strong);font:600 13px/1 var(--font-text);color:#fff\">\n                  Roll\n                  <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ s.onFile }}\" style=\"display:none\">\n                <\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ quota }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:11px 13px;border-radius:var(--radius-md);border:1px solid rgba(238,68,201,.45);font:400 11.5px/1.45 var(--font-text);color:#ee44c9\">Phone storage is full — the photo is still loaded in this session, but export the survey and clear it before shooting more stations.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasErr }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:11px 13px;border-radius:var(--radius-md);border:1px solid rgba(238,68,201,.45);font:400 11.5px/1.45 var(--font-text);color:#ee44c9\">{{ err }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"padding:16px;border-radius:var(--radius-lg);background:var(--surface-card);border:1px solid var(--hairline);display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font:600 10px/1 var(--font-text);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)\">Story video<\u002Fdiv>\n            <div style=\"font:400 11.5px/1.45 var(--font-text);color:var(--text-faint)\">Your piece to camera for this stone. It is kept whole in this browser's storage — not downscaled — and plays in the app on this phone.<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasVideo }}\" hint-placeholder-val=\"{{ false }}\">\n            <video ref=\"{{ videoRef }}\" style=\"width:100%;display:block;border-radius:var(--radius-md);background:#000;border:1px solid var(--hairline-strong)\"><\u002Fvideo>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasVideo }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font:500 11px/1.4 var(--font-mono);color:var(--text-muted)\">{{ videoMeta }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;gap:8px\">\n            <label style=\"cursor:pointer;flex:1;text-align:center;padding:13px;border-radius:var(--radius-full);background-image:var(--gradient-spectrum);font:600 13px/1 var(--font-text);color:#fff\">\n              {{ vidCamLabel }}\n              <input type=\"file\" accept=\"video/*\" capture=\"user\" sc-camel-on-change=\"{{ onVideo }}\" style=\"display:none\">\n            <\u002Flabel>\n            <label style=\"cursor:pointer;flex:none;text-align:center;padding:13px 16px;border-radius:var(--radius-full);border:1px solid var(--hairline-strong);font:600 13px/1 var(--font-text);color:#fff\">\n              Roll\n              <input type=\"file\" accept=\"video/*\" sc-camel-on-change=\"{{ onVideo }}\" style=\"display:none\">\n            <\u002Flabel>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasVidErr }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:11px 13px;border-radius:var(--radius-md);border:1px solid rgba(238,68,201,.45);font:400 11.5px/1.45 var(--font-text);color:#ee44c9\">{{ videoErr }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"padding:16px;border-radius:var(--radius-lg);background:var(--surface-card);border:1px solid var(--hairline);display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font:600 10px/1 var(--font-text);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)\">Notes to annotate<\u002Fdiv>\n          <textarea value=\"{{ notes }}\" sc-camel-on-change=\"{{ onNotes }}\" placeholder=\"Which features to circle, what to say to camera, where the stone sits in the row…\" style=\"box-sizing:border-box;width:100%;min-height:104px;padding:13px;background:#000;border:1px solid var(--hairline-strong);border-radius:var(--radius-md);font:400 14px/1.5 var(--font-text);color:#fff;resize:vertical\"><\u002Ftextarea>\n        <\u002Fdiv>\n\n        <div style=\"padding:16px;border-radius:var(--radius-lg);background:var(--surface-card);border:1px solid var(--hairline);display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font:600 10px/1 var(--font-text);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)\">Story text<\u002Fdiv>\n            <div style=\"font:400 11.5px/1.45 var(--font-text);color:var(--text-faint)\">Everything the app shows for this stone. Edits here override my placeholder copy and appear in the app immediately.<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ shortFields }}\" as=\"tf\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <label style=\"font:600 10px/1 var(--font-text);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-faint)\">{{ tf.label }}<\u002Flabel>\n              <input value=\"{{ tf.value }}\" sc-camel-on-change=\"{{ tf.onChange }}\" placeholder=\"{{ tf.placeholder }}\" style=\"box-sizing:border-box;width:100%;padding:12px;background:#000;border:1px solid var(--hairline-strong);border-radius:var(--radius-md);font:400 14px/1.3 var(--font-text);color:#fff\">\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-for list=\"{{ longFields }}\" as=\"tf\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <label style=\"font:600 10px/1 var(--font-text);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-faint)\">{{ tf.label }}<\u002Flabel>\n              <textarea value=\"{{ tf.value }}\" sc-camel-on-change=\"{{ tf.onChange }}\" placeholder=\"{{ tf.placeholder }}\" style=\"box-sizing:border-box;width:100%;min-height:92px;padding:12px;background:#000;border:1px solid var(--hairline-strong);border-radius:var(--radius-md);font:400 14px/1.5 var(--font-text);color:#fff;resize:vertical\"><\u002Ftextarea>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <label style=\"font:600 10px/1 var(--font-text);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-faint)\">Chapter cues — what you're seeing when<\u002Flabel>\n            <sc-for list=\"{{ chapterFields }}\" as=\"cf\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;gap:8px\">\n                <input value=\"{{ cf.time }}\" sc-camel-on-change=\"{{ cf.onTime }}\" placeholder=\"0:00\" style=\"box-sizing:border-box;width:74px;flex:none;padding:12px 10px;background:#000;border:1px solid var(--hairline-strong);border-radius:var(--radius-md);font:500 13px/1.3 var(--font-mono);color:#fff;text-align:center\">\n                <input value=\"{{ cf.label }}\" sc-camel-on-change=\"{{ cf.onLabel }}\" placeholder=\"{{ cf.placeholder }}\" style=\"box-sizing:border-box;flex:1;min-width:0;padding:12px;background:#000;border:1px solid var(--hairline-strong);border-radius:var(--radius-md);font:400 14px/1.3 var(--font-text);color:#fff\">\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:10px\">\n          <button sc-camel-on-click=\"{{ toList }}\" style=\"all:unset;cursor:pointer;flex:1;text-align:center;padding:15px;border-radius:var(--radius-full);border:1px solid var(--hairline-strong);font:600 14px/1 var(--font-text);color:#fff\" style-hover=\"background:rgba(255,255,255,.06)\">Done<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ nextStation }}\" style=\"all:unset;cursor:pointer;flex:1;text-align:center;padding:15px;border-radius:var(--radius-full);background-image:var(--gradient-spectrum);box-shadow:var(--glow-spectrum);font:600 14px/1 var(--font-text);color:#fff\" style-hover=\"filter:brightness(1.12)\">Next station<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isMap }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:0\">\n        <div style=\"position:relative;height:60vh;min-height:380px\">\n          <div ref=\"{{ mapRef }}\" style=\"position:absolute;inset:0;background:#060608\"><\u002Fdiv>\n          <div style=\"position:absolute;bottom:20px;left:14px;right:14px;z-index:600;padding:11px 13px;border-radius:var(--radius-md);background:rgba(14,14,18,.86);backdrop-filter:blur(12px);border:1px solid var(--hairline);pointer-events:none;font:400 11.5px/1.45 var(--font-text);color:var(--text-body)\">Dashed rings are planned corners; solid violet is a position you've recorded. The cyan dot is you.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:14px\">\n          <button sc-camel-on-click=\"{{ toList }}\" style=\"all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;text-align:center;padding:15px;border-radius:var(--radius-full);border:1px solid var(--hairline-strong);font:600 14px/1 var(--font-text);color:#fff\" style-hover=\"background:rgba(255,255,255,.06)\">Back to stations<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isExport }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:14px 14px 34px;display:flex;flex-direction:column;gap:14px\">\n        <button sc-camel-on-click=\"{{ toList }}\" style=\"all:unset;cursor:pointer;font:400 13px/1 var(--font-text);color:var(--text-muted)\" style-hover=\"color:#fff\">‹ Stations<\u002Fbutton>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <h2 style=\"margin:0;font:700 26px/1.06 var(--font-display);letter-spacing:-0.025em;background-image:var(--gradient-spectrum);-webkit-background-clip:text;background-clip:text;color:transparent\">Export the survey<\u002Fh2>\n          <div style=\"font:400 13px/1.5 var(--font-text);color:var(--text-body)\">{{ doneCount }} of 7 positions recorded. Publish them to the live site, or export the file and move them by hand.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:14px;border-radius:var(--radius-lg);background:var(--surface-card);border:1px solid var(--hairline);display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font:600 10px/1 var(--font-text);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)\">Publish to the live site<\u002Fdiv>\n          <div style=\"font:400 11.5px/1.45 var(--font-text);color:var(--text-faint)\">Sends the coordinates and text to the repo. Every phone that opens the walk gets these positions — photographs stay on this phone.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ publish }}\" style=\"all:unset;cursor:pointer;text-align:center;padding:14px;border-radius:var(--radius-full);background-image:var(--gradient-spectrum);box-shadow:var(--glow-spectrum);font:600 14px/1 var(--font-text);color:#fff\" style-hover=\"filter:brightness(1.12)\" style-active=\"transform:translateY(1px)\">{{ pubLabel }}<\u002Fbutton>\n          <div style=\"font:400 11.5px/1.45 var(--font-text);color:{{ pubColor }};min-height:16px\">{{ pubMsg }}<\u002Fdiv>\n          <sc-if value=\"{{ needToken }}\" hint-placeholder-val=\"{{ false }}\">\n            <input value=\"{{ token }}\" sc-camel-on-change=\"{{ onToken }}\" type=\"password\" placeholder=\"Paste your GitHub token\" style=\"box-sizing:border-box;width:100%;padding:12px;background:#000;border:1px solid var(--hairline-strong);border-radius:var(--radius-md);font:400 12px/1.4 var(--font-mono);color:#fff\">\n          <\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ toggleToken }}\" style=\"all:unset;cursor:pointer;font:400 11px/1.4 var(--font-text);color:var(--text-faint);text-align:center;padding:3px\" style-hover=\"color:#fff\">{{ tokenLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"padding:14px;border-radius:var(--radius-lg);background:var(--surface-card);border:1px solid var(--hairline);display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font:600 10px/1 var(--font-text);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)\">Coordinates<\u002Fdiv>\n          <pre style=\"margin:0;padding:13px;background:#000;border:1px solid var(--hairline);border-radius:var(--radius-md);font:500 11px/1.6 var(--font-mono);color:var(--spectrum-cyan);overflow:auto;white-space:pre-wrap;word-break:break-all\">{{ geoBlock }}<\u002Fpre>\n          <div style=\"display:flex;gap:9px\">\n            <button sc-camel-on-click=\"{{ copyGeo }}\" style=\"all:unset;cursor:pointer;flex:1;text-align:center;padding:13px;border-radius:var(--radius-full);background-image:var(--gradient-spectrum);font:600 13px/1 var(--font-text);color:#fff\" style-hover=\"filter:brightness(1.12)\">{{ copyLabel }}<\u002Fbutton>\n            <a href=\"{{ jsonHref }}\" download=\"cobblestone-field-survey.json\" style=\"flex:1;text-align:center;padding:13px;border-radius:var(--radius-full);border:1px solid var(--hairline-strong);font:600 13px/1 var(--font-text);color:#fff\">Download JSON<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:14px;border-radius:var(--radius-lg);background:var(--surface-card);border:1px solid var(--hairline);display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font:600 10px/1 var(--font-text);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)\">Full record<\u002Fdiv>\n          <pre style=\"margin:0;padding:13px;background:#000;border:1px solid var(--hairline);border-radius:var(--radius-md);font:500 10.5px/1.55 var(--font-mono);color:var(--text-body);max-height:280px;overflow:auto;white-space:pre-wrap;word-break:break-all\">{{ jsonBlock }}<\u002Fpre>\n        <\u002Fdiv>\n        <div style=\"padding:14px;border-radius:var(--radius-lg);background:var(--surface-card);border:1px solid var(--hairline);display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font:600 10px/1 var(--font-text);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)\">Photos<\u002Fdiv>\n          <div style=\"font:400 11.5px/1.45 var(--font-text);color:var(--text-faint)\">{{ photoCount }} frames captured. Publish them and they appear in the walk on every phone, not just this one.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ publishPhotos }}\" style=\"all:unset;cursor:pointer;text-align:center;padding:14px;border-radius:var(--radius-full);background-image:var(--gradient-spectrum);box-shadow:var(--glow-spectrum);font:600 14px/1 var(--font-text);color:#fff\" style-hover=\"filter:brightness(1.12)\" style-active=\"transform:translateY(1px)\">{{ photoPubLabel }}<\u002Fbutton>\n          <div style=\"font:400 11.5px/1.45 var(--font-text);color:{{ photoMsgColor }};min-height:16px\">{{ photoMsg }}<\u002Fdiv>\n          <div style=\"font:400 11px/1.45 var(--font-text);color:var(--text-faint);border-top:1px solid var(--hairline);padding-top:9px\">Or save copies to the camera roll:<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px\">\n            <sc-for list=\"{{ photoLinks }}\" as=\"pl\" hint-placeholder-count=\"3\">\n              <a href=\"{{ pl.href }}\" download=\"{{ pl.name }}\" style=\"display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--radius-md);border:1px solid var(--hairline);background:#000\">\n                <sc-if value=\"{{ pl.ok }}\" hint-placeholder-val=\"{{ false }}\">\n                  <img alt=\"\" ref=\"{{ pl.imgRef }}\" style=\"width:38px;height:38px;flex:none;border-radius:6px;object-fit:cover\">\n                <\u002Fsc-if>\n                <span style=\"font:500 12px/1.3 var(--font-text);color:#fff\">{{ pl.label }}<\u002Fspan>\n              <\u002Fa>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ reset }}\" style=\"all:unset;cursor:pointer;text-align:center;padding:14px;border-radius:var(--radius-full);border:1px solid rgba(238,68,201,.4);font:600 13px/1 var(--font-text);color:#ee44c9\" style-hover=\"background:rgba(238,68,201,.1)\">{{ resetLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:900}}\">\nconst STATIONS = [\n  { num:'01', rock:'Beryl', era:'Iapetus ocean floor', where:'Easy Street at Steamboat Wharf', lat:41.28793, lng:-70.09665 },\n  { num:'02', rock:'Garnet mica schist', era:'Taconic orogeny', where:'Broad Street at Centre', lat:41.28655, lng:-70.09992 },\n  { num:'03', rock:'Alkali granite', era:'Avalonian arrival', where:'Main Street at Federal', lat:41.28421, lng:-70.09952 },\n  { num:'04', rock:'Migmatite', era:'Alleghanian orogeny', where:'Upper Main Street at Gardner', lat:41.28185, lng:-70.10528 },\n  { num:'05', rock:'Dolerite', era:'Atlantic rifting', where:'Orange Street at Fair', lat:41.28118, lng:-70.09872 },\n  { num:'06', rock:'Granodiorite erratic', era:'Laurentide ice sheet', where:'Union Street at Stone Alley', lat:41.28251, lng:-70.09751 },\n  { num:'07', rock:'Ballast cobble', era:'Human time', where:'Straight Wharf at Main', lat:41.28556, lng:-70.09672 }\n];\n\nconst SHOTS = [\n  { key:'wide', title:'Wide — the standing view', body:'What the visitor sees from here. Include the street and a landmark so they can orient.', max:900, q:0.62 },\n  { key:'medium', title:'Medium — the stone in its row', body:'Frame the target cobble with its neighbours. This one becomes the annotated reference.', max:1200, q:0.72 },\n  { key:'macro', title:'Macro — the mineralogy', body:'Close enough to read grain, veins, and crystal faces. Shade it if the sun is harsh.', max:1000, q:0.68 }\n];\n\nconst PIXEL = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';\n\nconst KEY = 'cs-field-survey-v1';\nconst TOKEN_KEY = 'oika-gh-token';\nconst REPO = 'omniscopic/oika';\nconst BRANCH = 'main';\nconst SURVEY_PATH = 'w/cobblestone-stories/content/survey.json';\n\nclass Component extends DCLogic {\n  state = { screen:'list', idx:0, pos:null, sampling:false, sampleLeft:0, data:{}, copied:false, resetArmed:false, quota:false, busy:'', err:'', videoUrls:{}, vBusy:false, videoErr:'',\n            token:'', showToken:false, pubBusy:false, pubMsg:'', pubErr:false,\n            photoBusy:false, photoMsg:'', photoErr:false };\n  mapRef = React.createRef();\n\n  componentDidMount(){\n    try { const raw = localStorage.getItem(KEY); if (raw) this.setState({ data: JSON.parse(raw) }); } catch (e) {}\n    try { const t = localStorage.getItem(TOKEN_KEY); if (t) this.setState({ token:t }); } catch (e) {}\n    this.loadVideos();\n    if (navigator.geolocation) {\n      this._watch = navigator.geolocation.watchPosition(\n        (p) => {\n          const r = { lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy || 99, t:Date.now() };\n          this._buf = (this._buf || []).concat([r]).slice(-40);\n          this.setState({ pos:r });\n        },\n        () => this.setState({ pos:null }),\n        { enableHighAccuracy:true, maximumAge:0, timeout:20000 }\n      );\n    }\n    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { this._lock = l; }).catch(()=>{}); } catch (e) {}\n    this.syncMap();\n  }\n  componentDidUpdate(){ this.syncMap(); }\n  componentWillUnmount(){\n    if (this._watch) navigator.geolocation.clearWatch(this._watch);\n    clearInterval(this._tick);\n    if (this._lock) { try { this._lock.release(); } catch (e) {} }\n  }\n\n  db(){\n    if (!this._dbp) {\n      this._dbp = new Promise((res, rej) => {\n        const r = indexedDB.open('cobblestone-media', 1);\n        r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('videos')) d.createObjectStore('videos'); };\n        r.onsuccess = () => res(r.result);\n        r.onerror = () => rej(r.error);\n      });\n    }\n    return this._dbp;\n  }\n  idbPut(k, v){ return this.db().then(d => new Promise((res, rej) => { const t = d.transaction('videos','readwrite'); t.objectStore('videos').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); })); }\n  idbGet(k){ return this.db().then(d => new Promise((res, rej) => { const t = d.transaction('videos','readonly'); const q = t.objectStore('videos').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); })); }\n\n  loadVideos(){\n    STATIONS.forEach(s => {\n      this.idbGet('video-' + s.num).then(blob => {\n        if (!blob) return;\n        const urls = Object.assign({}, this.state.videoUrls);\n        urls[s.num] = URL.createObjectURL(blob);\n        this.setState({ videoUrls: urls });\n      }).catch(()=>{});\n    });\n  }\n\n  onVideo = (i) => (e) => {\n    const f = e.target.files && e.target.files[0];\n    if (!f) return;\n    const num = STATIONS[i].num;\n    this.setState({ vBusy:true, videoErr:'' });\n    this.idbPut('video-' + num, f).then(() => {\n      const urls = Object.assign({}, this.state.videoUrls);\n      urls[num] = URL.createObjectURL(f);\n      this.setState({ videoUrls: urls, vBusy:false });\n      this.patch(i, { video: { name:f.name, size:f.size, type:f.type, addedAt:new Date().toISOString() } });\n    }).catch(err => this.setState({ vBusy:false, videoErr:'Could not save that video: ' + ((err && err.message) || 'storage error') + '. Try a shorter clip.' }));\n  };\n\n  save(data){ this.setState({ data }); try { localStorage.setItem(KEY, JSON.stringify(data)); this.setState({ quota:false }); } catch (e) { this.setState({ quota:true }); } }\n\n  onToken = (e) => {\n    const v = e.target.value.trim();\n    this.setState({ token: v });\n    try { localStorage.setItem(TOKEN_KEY, v); } catch (err) {}\n  };\n  toggleToken = () => this.setState({ showToken: !this.state.showToken });\n\n  publishPayload(){\n    const out = {};\n    Object.keys(this.state.data || {}).forEach(num => {\n      const r = Object.assign({}, this.state.data[num]);\n      delete r.photos; delete r.thumb;     // image data stays on the phone; `shots` keeps the which-frames-exist flags\n      out[num] = r;\n    });\n    return out;\n  }\n\n  putFile = async (path, b64, token, message) => {\n    const api = 'https://api.github.com/repos/' + REPO + '/contents/' + path;\n    const headers = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' };\n    let sha = null;\n    const get = await fetch(api + '?ref=' + BRANCH, { headers });\n    if (get.ok) { const j = await get.json(); sha = j.sha; }\n    else if (get.status === 401) throw new Error('Token rejected. It needs Contents: write on this repo.');\n    const put = await fetch(api, {\n      method:'PUT', headers: Object.assign({ 'Content-Type':'application/json' }, headers),\n      body: JSON.stringify({ message, content:b64, branch:BRANCH, sha: sha || undefined })\n    });\n    if (!put.ok) { const e = await put.json().catch(()=>({})); throw new Error(e.message || ('GitHub said ' + put.status)); }\n  };\n\n  publishPhotos = async () => {\n    const token = (this.state.token || '').trim();\n    if (!token) { this.setState({ showToken:true, photoMsg:'Paste a GitHub token first.', photoErr:true }); return; }\n    const jobs = [];\n    Object.keys(this.state.data || {}).forEach(num => {\n      const photos = (this.state.data[num] || {}).photos || {};\n      ['wide','medium','macro'].forEach(key => {\n        const d = photos[key];\n        if (d && d.indexOf('base64,') > 0) {\n          jobs.push({ path: 'w/cobblestone-stories/media/stone-' + num + '/' + key + '.jpg',\n                      b64: d.slice(d.indexOf('base64,') + 7), num, key });\n        }\n      });\n    });\n    if (!jobs.length) { this.setState({ photoMsg:'No photographs captured yet.', photoErr:true }); return; }\n    this.setState({ photoBusy:true, photoErr:false, photoMsg:'Uploading 1 of ' + jobs.length + '…' });\n    try {\n      for (let n = 0; n < jobs.length; n++) {\n        this.setState({ photoMsg:'Uploading ' + (n+1) + ' of ' + jobs.length + '… (stone ' + jobs[n].num + ', ' + jobs[n].key + ')' });\n        await this.putFile(jobs[n].path, jobs[n].b64, token, 'Field Survey: stone ' + jobs[n].num + ' ' + jobs[n].key);\n      }\n      this.setState({ photoBusy:false, photoErr:false, photoMsg: jobs.length + ' photographs published. Live in about a minute.' });\n      setTimeout(()=>this.setState({ photoMsg:'' }), 9000);\n    } catch (err) {\n      this.setState({ photoBusy:false, photoErr:true, photoMsg: String(err.message || err) });\n    }\n  };\n\n  publish = async () => {\n    const token = (this.state.token || '').trim();\n    if (!token) { this.setState({ showToken:true, pubMsg:'Paste a GitHub token first.', pubErr:true }); return; }\n    this.setState({ pubBusy:true, pubMsg:'Publishing…', pubErr:false });\n    const api = 'https://api.github.com/repos/' + REPO + '/contents/' + SURVEY_PATH;\n    const headers = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' };\n    try {\n      let sha = null;\n      const get = await fetch(api + '?ref=' + BRANCH, { headers });\n      if (get.ok) { const j = await get.json(); sha = j.sha; }\n      else if (get.status === 401) throw new Error('Token rejected. It needs Contents: write on this repo.');\n      const json = JSON.stringify(this.publishPayload(), null, 2);\n      const b64 = btoa(unescape(encodeURIComponent(json)));\n      const put = await fetch(api, {\n        method:'PUT', headers: Object.assign({ 'Content-Type':'application/json' }, headers),\n        body: JSON.stringify({ message:'Field Survey: update survey.json', content:b64, branch:BRANCH, sha: sha || undefined })\n      });\n      if (!put.ok) { const e = await put.json().catch(()=>({})); throw new Error(e.message || ('GitHub said ' + put.status)); }\n      this.setState({ pubBusy:false, pubMsg:'Published. Live in about a minute.', pubErr:false });\n      setTimeout(()=>this.setState({ pubMsg:'' }), 8000);\n    } catch (err) {\n      this.setState({ pubBusy:false, pubMsg: String(err.message || err), pubErr:true });\n    }\n  };\n  rec(i){ return this.state.data[STATIONS[i].num] || {}; }\n  patch(i, obj){\n    const d = Object.assign({}, this.state.data);\n    d[STATIONS[i].num] = Object.assign({}, d[STATIONS[i].num] || {}, obj);\n    this.save(d);\n  }\n\n  dist(a, b){\n    const R = 6371000, toR = Math.PI/180;\n    const dLat = (b.lat-a.lat)*toR, dLng = (b.lng-a.lng)*toR;\n    const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLng/2)**2;\n    return 2*R*Math.asin(Math.sqrt(s));\n  }\n  fmtDist(m){ return m < 1000 ? Math.round(m) + ' m' : (m/1000).toFixed(2) + ' km'; }\n\n  open = (i) => () => this.setState({ screen:'station', idx:i });\n  toList = () => this.setState({ screen:'list' });\n  toMap = () => this.setState({ screen:'map' });\n  toExport = () => this.setState({ screen:'export', copied:false });\n  nextStation = () => this.setState({ idx: Math.min(6, this.state.idx + 1), screen:'station' });\n\n  sample = () => {\n    if (this.state.sampling || !this.state.pos) return;\n    this._buf = [];\n    this.setState({ sampling:true, sampleLeft:12 });\n    this._tick = setInterval(() => {\n      this.setState(s => {\n        if (s.sampleLeft <= 1) {\n          clearInterval(this._tick); this._tick = null;\n          const buf = (this._buf || []).slice();\n          let wsum = 0, lat = 0, lng = 0, best = 999;\n          buf.forEach(r => { const w = 1/Math.max(1, r.acc*r.acc); wsum += w; lat += r.lat*w; lng += r.lng*w; best = Math.min(best, r.acc); });\n          if (wsum > 0) {\n            this.patch(s.idx, { lat: lat/wsum, lng: lng/wsum, acc: best, n: buf.length, ts: new Date().toISOString() });\n          }\n          return { sampling:false, sampleLeft:0 };\n        }\n        return { sampleLeft: s.sampleLeft - 1 };\n      });\n    }, 1000);\n  };\n\n  toggleShot = (i, key) => () => {\n    const cur = (this.rec(i).shots || {});\n    const next = Object.assign({}, cur); next[key] = !cur[key];\n    this.patch(i, { shots: next });\n  };\n\n  onShot = (i, spec) => (e) => {\n    const input = e.target;\n    const file = input.files && input.files[0];\n    if (!file) return;\n    this.setState({ busy: spec.key, err:'' });\n    const url = URL.createObjectURL(file);\n    const img = new Image();\n    img.onload = () => {\n      try {\n        const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;\n        const sc = Math.min(1, spec.max / Math.max(w, h));\n        const c = document.createElement('canvas');\n        c.width = Math.max(1, Math.round(w * sc));\n        c.height = Math.max(1, Math.round(h * sc));\n        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);\n        const data = c.toDataURL('image/jpeg', spec.q);\n        URL.revokeObjectURL(url);\n        const rec = this.rec(i);\n        const photos = Object.assign({}, rec.photos || {}); photos[spec.key] = data;\n        const shots = Object.assign({}, rec.shots || {}); shots[spec.key] = true;\n        const p = { photos: photos, shots: shots };\n        if (spec.key === 'medium') p.thumb = data;\n        this.setState({ busy:'' });\n        this.patch(i, p);\n      } catch (err) {\n        URL.revokeObjectURL(url);\n        this.setState({ busy:'', err:'Could not process that image: ' + ((err && err.message) || 'unknown error') + '.' });\n      }\n    };\n    img.onerror = () => {\n      URL.revokeObjectURL(url);\n      this.setState({ busy:'', err:'That file could not be decoded. Shoot a JPEG, or pick a photo from the roll instead.' });\n    };\n    img.src = url;\n  };\n\n  onText = (i, key) => (e) => {\n    const t = Object.assign({}, this.rec(i).text || {});\n    t[key] = e.target.value;\n    this.patch(i, { text: t });\n  };\n  onChapter = (i, ci, field) => (e) => {\n    const t = Object.assign({}, this.rec(i).text || {});\n    const ch = (t.chapters || []).slice();\n    while (ch.length < 3) ch.push({ t:'', label:'' });\n    ch[ci] = Object.assign({}, ch[ci], field === 'time' ? { t: e.target.value } : { label: e.target.value });\n    t.chapters = ch;\n    this.patch(i, { text: t });\n  };\n\n  onNotes = (e) => this.patch(this.state.idx, { notes: e.target.value });\n\n  onPhoto = (e) => {\n    const f = e.target.files && e.target.files[0];\n    if (!f) return;\n    const i = this.state.idx;\n    const fr = new FileReader();\n    fr.onload = () => {\n      const img = new Image();\n      img.onload = () => {\n        const max = 520, sc = Math.min(1, max/Math.max(img.width, img.height));\n        const c = document.createElement('canvas');\n        c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);\n        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);\n        this.patch(i, { thumb: c.toDataURL('image/jpeg', 0.62), photoName: f.name });\n      };\n      img.src = fr.result;\n    };\n    fr.readAsDataURL(f);\n  };\n\n  copyGeo = () => {\n    const txt = this.geoText();\n    try { navigator.clipboard.writeText(txt); } catch (e) {}\n    this.setState({ copied:true });\n    setTimeout(()=>this.setState({ copied:false }), 2200);\n  };\n  reset = () => {\n    if (!this.state.resetArmed) { this.setState({ resetArmed:true }); setTimeout(()=>this.setState({ resetArmed:false }), 3500); return; }\n    this.save({}); this.setState({ resetArmed:false });\n  };\n\n  geoText(){\n    const lines = STATIONS.map((s,i) => {\n      const r = this.rec(i);\n      return r.lat\n        ? '  { lat:' + r.lat.toFixed(6) + ', lng:' + r.lng.toFixed(6) + ' },   // ' + s.num + ' ' + s.rock + '  ±' + Math.round(r.acc) + 'm'\n        : '  // ' + s.num + ' ' + s.rock + ' — not recorded';\n    });\n    return 'const GEO = [\\n' + lines.join('\\n') + '\\n];';\n  }\n  jsonText(){\n    return JSON.stringify(STATIONS.map((s,i) => {\n      const r = this.rec(i);\n      return { station:s.num, rock:s.rock, plannedCorner:s.where,\n        lat: r.lat ? +r.lat.toFixed(6) : null, lng: r.lng ? +r.lng.toFixed(6) : null,\n        accuracyM: r.acc ? Math.round(r.acc) : null, samples: r.n || 0, recordedAt: r.ts || null,\n        shots: r.shots || {}, referenceFrame: r.photoName || null, notes: r.notes || '', text: r.text || {}, video: r.video || null };\n    }), null, 2);\n  }\n\n  syncMap(){\n    if (this.state.screen !== 'map') return;\n    const L = window.L;\n    if (!L) { if (!this._lwait) { this._lwait = setTimeout(()=>{ this._lwait=null; this.forceUpdate(); }, 400); } return; }\n    const el = this.mapRef.current;\n    if (!el) return;\n    if (this._lmap && this._lmap.getContainer() !== el) { this._lmap.remove(); this._lmap = null; this._llayer = null; }\n    if (!this._lmap) {\n      this._lmap = L.map(el, { zoomControl:false, attributionControl:true });\n      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {\n        maxZoom: 19, attribution: 'Imagery: Esri, Maxar, Earthstar Geographics'\n      }).addTo(this._lmap);\n      this._llayer = L.layerGroup().addTo(this._lmap);\n      this._lmap.fitBounds(L.latLngBounds(STATIONS.map(s=>[s.lat,s.lng])), { padding:[52,52] });\n      setTimeout(()=>{ if (this._lmap) { this._lmap.invalidateSize(); this._lmap.fitBounds(L.latLngBounds(STATIONS.map(s=>[s.lat,s.lng])), { padding:[52,52] }); } }, 120);\n    }\n    this.drawGeo();\n  }\n  drawGeo(){\n    const L = window.L;\n    if (!this._llayer) return;\n    this._llayer.clearLayers();\n    STATIONS.forEach((s,i) => {\n      const r = this.rec(i), done = !!r.lat;\n      const html = '<div style=\"width:28px;height:28px;box-sizing:border-box;border-radius:50%;background:' +\n        (done ? '#9b55f2' : 'rgba(6,6,8,.8)') + ';border:2px ' + (done ? 'solid #ee44c9' : 'dashed rgba(255,255,255,.72)') +\n        ';color:#fff;font:700 11px/24px ui-monospace,Menlo,monospace;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.6)\">' + s.num + '<\u002Fdiv>';\n      const m = L.marker([done ? r.lat : s.lat, done ? r.lng : s.lng], {\n        icon: L.divIcon({ html: html, className:'', iconSize:[28,28], iconAnchor:[14,14] }), title: s.rock\n      });\n      m.on('click', this.open(i));\n      this._llayer.addLayer(m);\n    });\n    const p = this.state.pos;\n    if (p) {\n      const you = '<div style=\"width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #35cdf2;box-shadow:0 0 0 8px rgba(53,205,242,.22)\"><\u002Fdiv>';\n      this._llayer.addLayer(L.marker([p.lat, p.lng], { icon: L.divIcon({ html: you, className:'', iconSize:[16,16], iconAnchor:[8,8] }), zIndexOffset: 900 }));\n    }\n  }\n\n  renderVals(){\n    const s = this.state, p = s.pos, i = s.idx, st = STATIONS[i], r = this.rec(i);\n    const done = STATIONS.filter((x,k)=>!!this.rec(k).lat).length;\n    const acc = p ? p.acc : null;\n    const accColor = !p ? '#7a7a82' : (acc <= 6 ? '#35cdf2' : (acc <= 15 ? '#9b55f2' : '#ee44c9'));\n\n    let prompted = -1, promptM = 0;\n    if (p) {\n      STATIONS.forEach((x,k) => {\n        const target = this.rec(k).lat ? { lat:this.rec(k).lat, lng:this.rec(k).lng } : { lat:x.lat, lng:x.lng };\n        const m = this.dist(p, target);\n        if (m < 30 && !this.rec(k).lat && (prompted < 0 || m < promptM)) { prompted = k; promptM = m; }\n      });\n    }\n\n    const rows = STATIONS.map((x,k) => {\n      const rr = this.rec(k), has = !!rr.lat;\n      const shots = rr.shots || {};\n      const nShots = SHOTS.filter(sh => (rr.photos || {})[sh.key]).length;\n      const hasVid = !!s.videoUrls[x.num];\n      return { rock:(rr.text && rr.text.rock) || x.rock, sub: x.num + ' · ' + ((rr.text && rr.text.where) || x.where), onClick:this.open(k),\n        border: has ? 'rgba(155,85,242,.45)' : 'var(--hairline)',\n        chipBg: rr.thumb ? '#000' : (has ? 'transparent' : '#0e0e12'),\n        chipImg: (has && !rr.thumb) ? 'var(--gradient-spectrum)' : 'none',\n        chipSrc: rr.thumb || PIXEL, hasThumb: !!rr.thumb,\n        imgRef: (el) => { if (el) el.src = rr.thumb || PIXEL; },\n        chipColor: rr.thumb ? 'transparent' : (has ? '#fff' : '#55555d'),\n        chipText: rr.thumb ? '' : x.num,\n        state: has ? (nShots + '/3 shots' + (hasVid ? ' · video' : '')) : 'TO DO',\n        stateColor: has ? (nShots === 3 ? '#35cdf2' : '#b4b4ba') : '#55555d' };\n    });\n\n    const shots = SHOTS.map(sh => {\n      const url = (r.photos || {})[sh.key];\n      const on = !!url;\n      return { title:sh.title, body:sh.body, onFile:this.onShot(i, sh),\n        dot: on ? 'transparent' : 'var(--hairline-strong)',\n        fill: on ? 'var(--spectrum-violet)' : 'transparent',\n        check: on ? '✓' : '',\n        thumbH: on ? '150px' : '0px',\n        thumbBorder: on ? '1px solid var(--hairline-strong)' : '0 solid transparent',\n        thumbSrc: url || PIXEL, hasThumb: on,\n        imgRef: (el) => { if (el) el.src = url || PIXEL; },\n        camLabel: s.busy === sh.key ? 'Loading…' : (on ? 'Retake with camera' : 'Open camera') };\n    });\n\n    const photoLinks = [];\n    STATIONS.forEach((x,k) => {\n      const ph = (this.rec(k).photos || {});\n      SHOTS.forEach(sh => {\n        if (ph[sh.key]) photoLinks.push({\n          href: ph[sh.key], ok: true,\n          imgRef: ((u) => (el) => { if (el) el.src = u; })(ph[sh.key]),\n          name: 'stone-' + x.num + '-' + sh.key + '.jpg',\n          label: 'Stone ' + x.num + ' · ' + sh.key + ' · ' + x.rock\n        });\n      });\n    });\n\n    const geoBlock = this.geoText(), jsonBlock = this.jsonText();\n\n    const tx = r.text || {};\n    const shortFields = [\n      { key:'rock', label:'Rock name', placeholder:st.rock },\n      { key:'title', label:'Chapter title', placeholder:'The Ocean That Isn’t There' },\n      { key:'era', label:'Era or event', placeholder:st.era },\n      { key:'age', label:'Age', placeholder:'~480 Ma' },\n      { key:'where', label:'Corner as visitors should read it', placeholder:st.where },\n      { key:'minerals', label:'Minerals — comma separated', placeholder:'Antigorite, Chrysotile, Magnetite' }\n    ].map(f => ({ label:f.label, placeholder:f.placeholder, value: tx[f.key] || '', onChange: this.onText(i, f.key) }));\n    const longFields = [\n      { key:'find', label:'How to find the stone', placeholder:'Two rows in from the kerb, darker than its neighbours when wet…' },\n      { key:'look', label:'What to look for in the rock', placeholder:'Waxy olive-green, soapy to the touch, pale veins meeting at odd angles…' },\n      { key:'story', label:'Its place in the story', placeholder:'Before New England existed there was an ocean called Iapetus…' }\n    ].map(f => ({ label:f.label, placeholder:f.placeholder, value: tx[f.key] || '', onChange: this.onText(i, f.key) }));\n    const chSaved = tx.chapters || [];\n    const chapterFields = [0,1,2].map(ci => ({\n      time: (chSaved[ci] || {}).t || '', label: (chSaved[ci] || {}).label || '',\n      placeholder: ci === 0 ? 'Where this rock was made' : (ci === 1 ? 'The feature to look at' : 'Why it matters'),\n      onTime: this.onChapter(i, ci, 'time'), onLabel: this.onChapter(i, ci, 'label')\n    }));\n\n    return {\n      shortFields, longFields, chapterFields, stRock: tx.rock || st.rock,\n      isList: s.screen==='list', isStation: s.screen==='station', isMap: s.screen==='map', isExport: s.screen==='export',\n      mapRef: this.mapRef, rows, shots, st, doneCount: done,\n      gpsDot: !p ? '#55555d' : accColor,\n      gpsLabel: !p ? 'no fix' : '±' + Math.round(acc) + ' m',\n      liveLat: p ? p.lat.toFixed(6) : '—',\n      liveLng: p ? p.lng.toFixed(6) : '—',\n      accColor, accLabel: !p ? 'waiting for GPS' : (acc <= 6 ? 'excellent' : (acc <= 15 ? 'usable — hold still' : 'poor — move to open sky')),\n      plannedDist: p ? this.fmtDist(this.dist(p, { lat:st.lat, lng:st.lng })) + ' from the planned corner' : 'Allow location to see how far you are from the planned corner.',\n      sampling: s.sampling,\n      sampleLabel: s.sampling ? 'Averaging… ' + s.sampleLeft + 's — hold still' : (r.lat ? 'Re-record this position' : 'Record standing position'),\n      sampleBg: s.sampling ? 'none' : 'var(--gradient-spectrum)',\n      sampleBgColor: s.sampling ? '#202028' : 'transparent',\n      sampleBorder: s.sampling ? 'var(--hairline-strong)' : 'transparent',\n      sampleGlow: s.sampling ? 'none' : 'var(--glow-spectrum)',\n      hasFix: !!r.lat,\n      fixText: r.lat ? r.lat.toFixed(6) + ', ' + r.lng.toFixed(6) : '',\n      fixMeta: r.lat ? '±' + Math.round(r.acc) + ' m best of ' + (r.n||0) + ' readings · ' + String(r.ts||'').slice(0,16).replace('T',' ') : '',\n      hasThumb: !!r.thumb, thumbImg: r.thumb ? 'url(' + r.thumb + ')' : 'none',\n      photoLabel: r.thumb ? 'Replace reference frame' : 'Attach reference frame',\n      quota: s.quota, hasErr: !!s.err, err: s.err, photoLinks, photoCount: photoLinks.length,\n      hasVideo: !!s.videoUrls[st.num],\n      videoRef: (el) => {\n        if (!el) return;\n        el.controls = true; el.playsInline = true; el.setAttribute('playsinline', 'playsinline');\n        el.preload = 'metadata';\n        const u = s.videoUrls[st.num];\n        if (u && el.src !== u) el.src = u;\n      },\n      videoMeta: r.video ? (r.video.name || 'clip') + ' · ' + Math.round((r.video.size || 0)/1048576) + ' MB' : '',\n      vidCamLabel: s.vBusy ? 'Saving…' : (s.videoUrls[st.num] ? 'Record again' : 'Record video'),\n      onVideo: this.onVideo(i),\n      hasVidErr: !!s.videoErr, videoErr: s.videoErr,\n      notes: r.notes || '',\n      prompting: prompted >= 0 && s.screen === 'list',\n      promptNum: prompted >= 0 ? STATIONS[prompted].num : '',\n      promptWhere: prompted >= 0 ? STATIONS[prompted].where : '',\n      promptDist: prompted >= 0 ? this.fmtDist(promptM) : '',\n      openPrompted: prompted >= 0 ? this.open(prompted) : this.toList,\n      geoBlock, jsonBlock,\n      jsonHref: 'data:application/json;charset=utf-8,' + encodeURIComponent(jsonBlock),\n      copyLabel: s.copied ? 'Copied' : 'Copy coordinates',\n      resetLabel: s.resetArmed ? 'Tap again to erase everything' : 'Clear the survey',\n      open: this.open, toList: this.toList, toMap: this.toMap, toExport: this.toExport,\n      nextStation: this.nextStation, sample: this.sample, onNotes: this.onNotes, onPhoto: this.onPhoto,\n      copyGeo: this.copyGeo, reset: this.reset,\n      publish: this.publish, onToken: this.onToken, toggleToken: this.toggleToken,\n      token: s.token,\n      needToken: s.showToken || !s.token,\n      tokenLabel: s.showToken ? 'Hide token' : (s.token ? 'Change GitHub token' : 'Set a GitHub token'),\n      pubLabel: s.pubBusy ? 'Publishing…' : 'Publish coordinates',\n      pubMsg: s.pubMsg,\n      pubColor: s.pubErr ? '#ee44c9' : '#35cdf2',\n      publishPhotos: this.publishPhotos,\n      photoPubLabel: s.photoBusy ? 'Uploading…' : 'Publish photographs',\n      photoMsg: s.photoMsg,\n      photoMsgColor: s.photoErr ? '#ee44c9' : '#35cdf2'\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
