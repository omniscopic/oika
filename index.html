document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"2b1a4926-1ee1-42b2-b6c6-f472d9b851e1\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"125c6936-31d5-46bb-8513-6d39b0c62bdb\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* Oika — Color tokens\n   The brand lives on pure black. Color enters through two gradients:\n   the signature spectrum (cyan→violet→magenta) and a metallic silver for titles. */\n:root {\n  /* Base surfaces — near-black, cool */\n  --black: #000000;\n  --ink-900: #060608;\n  --ink-800: #0e0e12;\n  --ink-700: #16161c;\n  --ink-600: #202028;\n  --ink-500: #2c2c36;\n  --hairline: rgba(255,255,255,0.12);\n  --hairline-strong: rgba(255,255,255,0.22);\n\n  /* Text on dark */\n  --text-primary: #ffffff;\n  --text-body: #b4b4ba;      /* the soft-gray running text on quote/content slides */\n  --text-muted: #7a7a82;\n  --text-faint: #55555d;\n  --text-on-light: #0e0e12;\n\n  /* Signature spectrum — stops sampled from the deck's display headings */\n  --spectrum-cyan:    #35cdf2;\n  --spectrum-blue:    #5f8bf0;\n  --spectrum-violet:  #9b55f2;\n  --spectrum-magenta: #ee44c9;\n  --gradient-spectrum: linear-gradient(90deg, #35cdf2 0%, #5f8bf0 34%, #9b55f2 64%, #ee44c9 100%); /* @kind color */\n  /* Softer, for large fills / glows */\n  --gradient-spectrum-soft: linear-gradient(90deg, #35cdf2 0%, #9b55f2 55%, #ee44c9 100%); /* @kind color */\n\n  /* Metallic silver — used on content-slide titles (e.g. \"The Anthropocene\") */\n  --gradient-silver: linear-gradient(180deg, #ffffff 0%, #ededf0 42%, #a7a7ae 100%); /* @kind color */\n\n  /* Supporting accents (used sparingly, e.g. diagram fills in the source deck) */\n  --clay-red: #9e1b0f;\n  --twilight: #0a1a3a;   /* deep blue found behind cosmic imagery */\n\n  /* Semantic aliases */\n  --surface-page: var(--black);\n  --surface-card: var(--ink-800);\n  --surface-raised: var(--ink-700);\n  --border-default: var(--hairline);\n  --accent: var(--spectrum-violet);\n  --link: var(--spectrum-cyan);\n  --link-hover: #7fdcf6;\n  --focus-ring: var(--spectrum-cyan);\n}\n<\u002Fstyle>\n<style>/* Oika — Typography tokens\n   Source decks are set in Apple's SF Pro (Display for headings, Text for body),\n   as exported from Keynote. SF Pro is not web-distributable, so the primary\n   web family is Hanken Grotesk (Google Fonts, loaded in fonts.css) — a\n   geometric-humanist grotesque close to SF Pro's proportions. On Apple\n   hardware the stack still prefers the genuine SF Pro first. See readme \"Fonts\". */\n:root {\n  --font-display: \"Hanken Grotesk\", -apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"Helvetica Neue\", Helvetica, sans-serif;\n  --font-text: \"Hanken Grotesk\", -apple-system, BlinkMacSystemFont, \"SF Pro Text\", \"Helvetica Neue\", Helvetica, sans-serif;\n  --font-mono: ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  /* Weights — the deck leans on Bold display + Regular/Medium body */\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n  --weight-heavy: 800;\n\n  /* Type scale — px, tuned for a 1920×1080 stage; scale down for web/doc use */\n  --text-hero: 96px;     /* full-bleed title headline */\n  --text-6xl: 76px;      /* section headline */\n  --text-5xl: 60px;      /* content-slide title */\n  --text-4xl: 48px;\n  --text-3xl: 40px;      /* large quote body */\n  --text-2xl: 34px;      /* bullet / body-large on stage */\n  --text-xl: 28px;\n  --text-lg: 22px;\n  --text-base: 18px;\n  --text-sm: 15px;\n  --text-xs: 13px;\n\n  /* Line heights */\n  --leading-tight: 1.05;   /* display headlines */\n  --leading-snug: 1.2;\n  --leading-normal: 1.4;\n  --leading-relaxed: 1.55; /* running body / quotes */\n\n  /* Letter spacing */\n  --tracking-tight: -0.02em;   /* large display */\n  --tracking-normal: 0em;\n  --tracking-wide: 0.04em;\n  --tracking-caps: 0.14em;     /* small caps labels, e.g. RESEARCH */\n}\n<\u002Fstyle>\n<style>/* Oika — Spacing & layout tokens (4px base grid) */\n:root {\n  --space-0: 0;\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n  --space-10: 128px;\n\n  /* Stage geometry — the deck's safe margins on a 1920×1080 frame */\n  --stage-w: 1920px;\n  --stage-h: 1080px;\n  --stage-margin-x: 128px;   /* generous left/right gutter on content slides */\n  --stage-margin-y: 96px;\n\n  /* Content measures */\n  --measure-body: 60ch;\n  --measure-quote: 34ch;\n}\n<\u002Fstyle>\n<style>/* Oika — Effects: radii, shadows, motion, glow */\n:root {\n  /* Radii — the deck itself is mostly hard-edged; rounding is reserved for\n     media, chips and web UI. Circles (the \"Science\" bubble) use --radius-full. */\n  --radius-none: 0;\n  --radius-sm: 6px;\n  --radius-md: 10px;\n  --radius-lg: 16px;\n  --radius-xl: 24px;\n  --radius-full: 999px;\n\n  /* Shadows — media on stage sits on a soft dark drop; web cards stay subtle */\n  --shadow-image: 0 24px 70px rgba(0,0,0,0.55);\n  --shadow-image-stack: 0 18px 50px rgba(0,0,0,0.5);\n  --shadow-card: 0 1px 0 rgba(255,255,255,0.04) inset, 0 12px 32px rgba(0,0,0,0.45);\n  --shadow-pop: 0 20px 60px rgba(0,0,0,0.6);\n\n  /* Spectrum glow — a diffuse aura behind key marks/CTAs */\n  --glow-spectrum: 0 0 60px rgba(120,110,240,0.35);\n\n  /* Protection scrim — legibility gradient over full-bleed imagery */\n  --scrim-bottom: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%); /* @kind color */\n  --scrim-full: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.1) 45%, rgba(0,0,0,0.6) 100%); /* @kind color */\n\n  /* Motion — restrained; content cross-fades, nothing bounces */\n  --ease-standard: cubic-bezier(0.22, 0.61, 0.36, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 140ms; /* @kind other */\n  --dur-base: 260ms; /* @kind other */\n  --dur-slow: 520ms; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* Oika — interaction states for interactive components (hover/active/focus).\n   Inline styles can't express pseudo-states, so the small set of interactive\n   primitives (Button, links) declare them here. Ships via styles.css. */\n\na { color: var(--link); text-decoration: none; transition: color var(--dur-base) var(--ease-standard); }\na:hover { color: var(--link-hover); }\n\n.oika-btn { -webkit-tap-highlight-color: transparent; }\n.oika-btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }\n.oika-btn:active { transform: translateY(1px); }\n.oika-btn--primary:hover { filter: brightness(1.08) saturate(1.05); }\n.oika-btn--secondary:hover { background: rgba(255,255,255,0.06); border-color: var(--text-primary); }\n.oika-btn--ghost:hover { color: var(--link-hover); }\n.oika-btn[disabled] { opacity: 0.45; cursor: not-allowed; pointer-events: none; }\n<\u002Fstyle>\n<style>/* Oika Design System — global entry point.\n   Consumers link this one file. Import order: fonts, then tokens. */\n/* Oika — Fonts\n   Cross-platform fallback for SF Pro. Hanken Grotesk is a geometric-humanist\n   grotesque close to SF Pro's proportions. On Apple hardware the stack in\n   typography.css resolves to the genuine SF Pro before reaching this. */\n/* cyrillic-ext */\ 60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"125c6936-31d5-46bb-8513-6d39b0c62bdb\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Oika — Color tokens\n   The brand lives on pure black. Color enters through two gradients:\n   the signature spectrum (cyan→violet→magenta) and a metallic silver for titles. */\n:root {\n  /* Base surfaces — near-black, cool */\n  --black: #000000;\n  --ink-900: #060608;\n  --ink-800: #0e0e12;\n  --ink-700: #16161c;\n  --ink-600: #202028;\n  --ink-500: #2c2c36;\n  --hairline: rgba(255,255,255,0.12);\n  --hairline-strong: rgba(255,255,255,0.22);\n\n  /* Text on dark */\n  --text-primary: #ffffff;\n  --text-body: #b4b4ba;      /* the soft-gray running text on quote/content slides */\n  --text-muted: #7a7a82;\n  --text-faint: #55555d;\n  --text-on-light: #0e0e12;\n\n  /* Signature spectrum — stops sampled from the deck's display headings */\n  --spectrum-cyan:    #35cdf2;\n  --spectrum-blue:    #5f8bf0;\n  --spectrum-violet:  #9b55f2;\n  --spectrum-magenta: #ee44c9;\n  --gradient-spectrum: linear-gradient(90deg, #35cdf2 0%, #5f8bf0 34%, #9b55f2 64%, #ee44c9 100%); /* @kind color */\n  /* Softer, for large fills / glows */\n  --gradient-spectrum-soft: linear-gradient(90deg, #35cdf2 0%, #9b55f2 55%, #ee44c9 100%); /* @kind color */\n\n  /* Metallic silver — used on content-slide titles (e.g. \"The Anthropocene\") */\n  --gradient-silver: linear-gradient(180deg, #ffffff 0%, #ededf0 42%, #a7a7ae 100%); /* @kind color */\n\n  /* Supporting accents (used sparingly, e.g. diagram fills in the source deck) */\n  --clay-red: #9e1b0f;\n  --twilight: #0a1a3a;   /* deep blue found behind cosmic imagery */\n\n  /* Semantic aliases */\n  --surface-page: var(--black);\n  --surface-card: var(--ink-800);\n  --surface-raised: var(--ink-700);\n  --border-default: var(--hairline);\n  --accent: var(--spectrum-violet);\n  --link: var(--spectrum-cyan);\n  --link-hover: #7fdcf6;\n  --focus-ring: var(--spectrum-cyan);\n}\n\n/* Oika — Typography tokens\n   Source decks are set in Apple's SF Pro (Display for headings, Text for body),\n   as exported from Keynote. SF Pro is not web-distributable, so the primary\n   web family is Hanken Grotesk (Google Fonts, loaded in fonts.css) — a\n   geometric-humanist grotesque close to SF Pro's proportions. On Apple\n   hardware the stack still prefers the genuine SF Pro first. See readme \"Fonts\". */\n:root {\n  --font-display: \"Hanken Grotesk\", -apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"Helvetica Neue\", Helvetica, sans-serif;\n  --font-text: \"Hanken Grotesk\", -apple-system, BlinkMacSystemFont, \"SF Pro Text\", \"Helvetica Neue\", Helvetica, sans-serif;\n  --font-mono: ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  /* Weights — the deck leans on Bold display + Regular/Medium body */\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n  --weight-heavy: 800;\n\n  /* Type scale — px, tuned for a 1920×1080 stage; scale down for web/doc use */\n  --text-hero: 96px;     /* full-bleed title headline */\n  --text-6xl: 76px;      /* section headline */\n  --text-5xl: 60px;      /* content-slide title */\n  --text-4xl: 48px;\n  --text-3xl: 40px;      /* large quote body */\n  --text-2xl: 34px;      /* bullet / body-large on stage */\n  --text-xl: 28px;\n  --text-lg: 22px;\n  --text-base: 18px;\n  --text-sm: 15px;\n  --text-xs: 13px;\n\n  /* Line heights */\n  --leading-tight: 1.05;   /* display headlines */\n  --leading-snug: 1.2;\n  --leading-normal: 1.4;\n  --leading-relaxed: 1.55; /* running body / quotes */\n\n  /* Letter spacing */\n  --tracking-tight: -0.02em;   /* large display */\n  --tracking-normal: 0em;\n  --tracking-wide: 0.04em;\n  --tracking-caps: 0.14em;     /* small caps labels, e.g. RESEARCH */\n}\n\n/* Oika — Spacing & layout tokens (4px base grid) */\n:root {\n  --space-0: 0;\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n  --space-10: 128px;\n\n  /* Stage geometry — the deck's safe margins on a 1920×1080 frame */\n  --stage-w: 1920px;\n  --stage-h: 1080px;\n  --stage-margin-x: 128px;   /* generous left/right gutter on content slides */\n  --stage-margin-y: 96px;\n\n  /* Content measures */\n  --measure-body: 60ch;\n  --measure-quote: 34ch;\n}\n\n/* Oika — Effects: radii, shadows, motion, glow */\n:root {\n  /* Radii — the deck itself is mostly hard-edged; rounding is reserved for\n     media, chips and web UI. Circles (the \"Science\" bubble) use --radius-full. */\n  --radius-none: 0;\n  --radius-sm: 6px;\n  --radius-md: 10px;\n  --radius-lg: 16px;\n  --radius-xl: 24px;\n  --radius-full: 999px;\n\n  /* Shadows — media on stage sits on a soft dark drop; web cards stay subtle */\n  --shadow-image: 0 24px 70px rgba(0,0,0,0.55);\n  --shadow-image-stack: 0 18px 50px rgba(0,0,0,0.5);\n  --shadow-card: 0 1px 0 rgba(255,255,255,0.04) inset, 0 12px 32px rgba(0,0,0,0.45);\n  --shadow-pop: 0 20px 60px rgba(0,0,0,0.6);\n\n  /* Spectrum glow — a diffuse aura behind key marks/CTAs */\n  --glow-spectrum: 0 0 60px rgba(120,110,240,0.35);\n\n  /* Protection scrim — legibility gradient over full-bleed imagery */\n  --scrim-bottom: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%); /* @kind color */\n  --scrim-full: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.1) 45%, rgba(0,0,0,0.6) 100%); /* @kind color */\n\n  /* Motion — restrained; content cross-fades, nothing bounces */\n  --ease-standard: cubic-bezier(0.22, 0.61, 0.36, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 140ms; /* @kind other */\n  --dur-base: 260ms; /* @kind other */\n  --dur-slow: 520ms; /* @kind other */\n}\n\n/* Oika — interaction states for interactive components (hover/active/focus).\n   Inline styles can't express pseudo-states, so the small set of interactive\n   primitives (Button, links) declare them here. Ships via styles.css. */\n\na { color: var(--link); text-decoration: none; transition: color var(--dur-base) var(--ease-standard); }\na:hover { color: var(--link-hover); }\n\n.oika-btn { -webkit-tap-highlight-color: transparent; }\n.oika-btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }\n.oika-btn:active { transform: translateY(1px); }\n.oika-btn--primary:hover { filter: brightness(1.08) saturate(1.05); }\n.oika-btn--secondary:hover { background: rgba(255,255,255,0.06); border-color: var(--text-primary); }\n.oika-btn--ghost:hover { color: var(--link-hover); }\n.oika-btn[disabled] { opacity: 0.45; cursor: not-allowed; pointer-events: none; }\n\n<\u002Fstyle>\n<script src=\"59948fc5-09dc-45d2-9708-4a871e9cba3e\"><\u002Fscript>\n<style>\nhtml, body { margin:0; background:#000; }\na { color:#35cdf2; text-decoration:none; }\na:hover { color:#7fe0f8; }\n@keyframes oik-rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;box-sizing:border-box;background:#000;color:#b4b4ba;font-family:-apple-system,'SF Pro Text','Hanken Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:0 22px 72px\">\n\n  <div style=\"width:100%;max-width:560px;display:flex;flex-direction:column;gap:34px;animation:oik-rise .5s ease-out\">\n\n    <div style=\"padding-top:60px;display:flex;flex-direction:column;gap:22px\">\n      <div style=\"display:flex;align-items:flex-end;gap:11px\">\n        <img src=\"5f0eb667-dd9e-4218-b596-dfcf3f8933e7\" alt=\"Oika\" style=\"width:96px;height:auto;display:block\">\n        <span style=\"font-family:-apple-system,'SF Pro Display','Hanken Grotesk',sans-serif;font-weight:700;font-size:31px;line-height:0.86;letter-spacing:-0.03em;background-image:linear-gradient(90deg,#9b55f2,#ee44c9);-webkit-background-clip:text;background-clip:text;color:transparent\">Go<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:13px\">\n        <h1 style=\"margin:0;font-family:-apple-system,'SF Pro Display','Hanken Grotesk',sans-serif;font-weight:700;font-size:37px;line-height:1.04;letter-spacing:-0.028em;background-image:linear-gradient(90deg,#35cdf2,#5f8bf0,#9b55f2,#ee44c9);-webkit-background-clip:text;background-clip:text;color:transparent\">Go See Deep Time<\u002Fh1>\n        <p style=\"margin:0;font-size:16px;line-height:1.55;color:#b4b4ba;text-wrap:pretty\">Guided experiences that turn a place you thought you knew — or a sky you stopped noticing — into a story of deep time. Bring headphones. Move slowly.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"height:1px;background:rgba(255,255,255,.12)\"><\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#6d6d76\">Open now<\u002Fdiv>\n\n      <a href=\"w/cobblestone-stories/\" style=\"display:block;border-radius:14px;overflow:hidden;background:#0e0f11;border:1px solid rgba(53,205,242,.34);box-shadow:0 18px 44px rgba(0,0,0,.6)\" style-hover=\"border-color:rgba(53,205,242,.72)\">\n        <div style=\"padding:20px 22px 24px;display:flex;gap:16px;align-items:flex-start\">\n        <div style=\"flex:none;width:82px;height:82px;border-radius:10px;background:linear-gradient(160deg,#12161c,#05070a);overflow:hidden;border:1px solid rgba(255,255,255,.12)\">\n          <img src=\"d3661a90-1778-4af9-ab41-2074ff10eb2a\" alt=\"\" ref=\"{{ hideOnError }}\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\n        <\u002Fdiv>\n        <div style=\"min-width:0;flex:1;display:flex;flex-direction:column;gap:13px\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n            <x-import component-from-global-scope=\"OikaDesignSystem_2fcc49.Tag\" variant=\"spectrum\" hint-size=\"auto,24px\">Nantucket<\u002Fx-import>\n            <x-import component-from-global-scope=\"OikaDesignSystem_2fcc49.Tag\" variant=\"outline\" hint-size=\"auto,24px\">7 stations<\u002Fx-import>\n            <x-import component-from-global-scope=\"OikaDesignSystem_2fcc49.Tag\" variant=\"outline\" hint-size=\"auto,24px\">90 minutes<\u002Fx-import>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"font-family:-apple-system,'SF Pro Display','Hanken Grotesk',sans-serif;font-weight:700;font-size:27px;line-height:1.1;letter-spacing:-0.02em;color:#fff\">Cobblestone Stories<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.55;color:#b4b4ba;text-wrap:pretty\">Seven stones set in a downtown street, each a survivor of a different age of the Earth. Stand where they lie and watch the street dissolve back into the world that made them.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding-top:4px\">\n            <x-import component-from-global-scope=\"OikaDesignSystem_2fcc49.Button\" variant=\"primary\" hint-size=\"200px,44px\">Enter your ticket code<\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fa>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#6d6d76\">In development<\u002Fdiv>\n\n      <div style=\"border-radius:14px;overflow:hidden;background:#0a0a0b;border:1px solid rgba(255,255,255,.1)\">\n        <div style=\"padding:18px 20px 20px;display:flex;gap:16px;align-items:flex-start\">\n        <div style=\"flex:none;width:82px;height:82px;border-radius:10px;background:radial-gradient(circle at 40% 45%,#1d2340,#080a12 70%);overflow:hidden;border:1px solid rgba(255,255,255,.1)\">\n          <img src=\"9dd6e6e1-0d6c-4af4-b9a8-5edc5083cadf\" alt=\"\" ref=\"{{ hideOnError }}\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\n        <\u002Fdiv>\n        <div style=\"min-width:0;flex:1;display:flex;flex-direction:column;gap:9px\">\n          <x-import component-from-global-scope=\"OikaDesignSystem_2fcc49.Tag\" hint-size=\"auto,24px\">In development<\u002Fx-import>\n          <div style=\"font-family:-apple-system,'SF Pro Display','Hanken Grotesk',sans-serif;font-weight:700;font-size:21px;line-height:1.15;letter-spacing:-0.015em;color:#e8e8ec\">Cosmic Microwave Background Explorer<\u002Fdiv>\n          <p style=\"margin:0;font-size:14px;line-height:1.5;color:#8a8a93;text-wrap:pretty\">The oldest light there is, still arriving. Read the faint temperature map of the infant universe and find your own place inside it.<\u002Fp>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-radius:14px;overflow:hidden;background:#0a0a0b;border:1px solid rgba(255,255,255,.1)\">\n        <div style=\"padding:18px 20px 20px;display:flex;gap:16px;align-items:flex-start\">\n        <div style=\"flex:none;width:82px;height:82px;border-radius:10px;background:radial-gradient(circle at 50% 50%,#20222a,#07080b 72%);overflow:hidden;border:1px solid rgba(255,255,255,.1)\">\n          <img src=\"1d6680f4-3c97-4cdb-bd13-6c53cbe82617\" alt=\"\" ref=\"{{ hideOnError }}\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\n        <\u002Fdiv>\n        <div style=\"min-width:0;flex:1;display:flex;flex-direction:column;gap:9px\">\n          <x-import component-from-global-scope=\"OikaDesignSystem_2fcc49.Tag\" hint-size=\"auto,24px\">In development<\u002Fx-import>\n          <div style=\"font-family:-apple-system,'SF Pro Display','Hanken Grotesk',sans-serif;font-weight:700;font-size:21px;line-height:1.15;letter-spacing:-0.015em;color:#e8e8ec\">Seeing the Moon for the First Time<\u002Fdiv>\n          <p style=\"margin:0;font-size:14px;line-height:1.5;color:#8a8a93;text-wrap:pretty\">You have looked at it ten thousand times. This one asks you to look once more, and shows you what you have been missing.<\u002Fp>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:10px;padding-top:6px\">\n      <div style=\"height:1px;background:rgba(255,255,255,.12)\"><\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding-top:12px;font-size:13px;line-height:1.5;color:#6d6d76\">\n        <span>A project of the Beautiful Futures Lab<\u002Fspan>\n        <a href=\"https://oika.com\">oika.com<\u002Fa>\n        <a href=\"https://beautifulfutureslab.org\">BeautifulFuturesLab.org<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  // A missing card image leaves the panel's own gradient showing rather than a broken icon.\n  hideOnError = (el) => {\n    if (!el) return;\n    el.onerror = () => { el.style.display = 'none'; };\n    if (el.complete && el.naturalWidth === 0) el.style.display = 'none';\n  };\n\n  renderVals() {\n    return { hideOnError: this.hideOnError };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
